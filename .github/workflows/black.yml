name: Black Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  black:
    name: Check formatting with Black
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Black
        uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "."