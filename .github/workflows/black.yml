name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  black:
    name: Check formatting with Black
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Black
        uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "."